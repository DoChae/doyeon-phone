<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>도연의 폰 (그 후)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--top:50px;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:#16141c;color:#9a94aa;font-family:var(--ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 16px;box-sizing:border-box;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hint{font-size:13px;margin:0;text-align:center}.hint b{color:#e8e3f3}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}

.phone{position:relative;height:min(844px,calc(100% - 40px));aspect-ratio:390/844;max-width:100%;background:#0b0a0e;border-radius:58px;padding:11px;box-sizing:border-box;box-shadow:0 40px 80px rgba(0,0,0,.55),inset 0 0 0 2px #3a3644,inset 0 0 0 6px #121016}
.side{position:absolute;width:4px;background:#2a2732;border-radius:2px;border:0;padding:0}
.side.l1{left:-3px;top:18%;height:5%}.side.l2{left:-3px;top:26%;height:9%}.side.l3{left:-3px;top:37%;height:9%}.side.r{right:-3px;top:27%;height:13%;cursor:pointer}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:#000;color:#000;--wall:linear-gradient(160deg,#ff7a59,#6c4a9e 55%,#2b2a6e)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 36px;box-sizing:border-box;font-size:16px;font-weight:600;z-index:59;font-variant-numeric:tabular-nums;color:#000;pointer-events:none;transition:color .3s}
.status.light{color:#fff}.status .right{display:flex;gap:6px;align-items:center}
.view{position:absolute;inset:0;display:flex;flex-direction:column;box-sizing:border-box}
.wall{background:var(--wall) center/cover}

/* 잠금 */
#lock{color:#fff;z-index:30;touch-action:none}
#lockInner{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--top) + 18px);transition:transform .3s,opacity .3s}
#lock.drag #lockInner{transition:none}
.ldate{font-size:19px;font-weight:600;opacity:.92}
.ltime{font-size:92px;font-weight:700;line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums;margin-top:2px}
.notis{margin-top:auto;width:100%;padding:0 10px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.noti{background:rgba(250,250,252,.62);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border-radius:22px;padding:11px 14px;display:flex;gap:11px;color:#111;text-align:left;border:0;width:100%;box-sizing:border-box}
.noti.new{animation:notin .55s cubic-bezier(.2,.9,.25,1.15)}
@keyframes notin{from{transform:translateY(40px) scale(.96);opacity:0}}
.noti .ni{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:grid;place-items:center}.noti .ni svg{width:62%}
.noti .nb{flex:1;min-width:0}
.noti .nt{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:600}
.noti .nt span{font-weight:400;font-size:13px;color:#555}
.noti .nx{font-size:14.5px;line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lockbottom{width:100%;display:flex;justify-content:space-between;padding:20px 46px 6px;box-sizing:border-box}
.round{width:50px;height:50px;border-radius:50%;background:rgba(30,30,40,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;place-items:center;border:0;cursor:pointer}.round svg{width:22px}
.swipe{font-size:14px;opacity:.85;padding:6px 0 4px;background:none;border:0;cursor:pointer;color:#fff}
.homebar{height:26px;width:100%;display:grid;place-items:center;border:0;background:none;cursor:pointer;flex-shrink:0;padding:0;touch-action:none}
.homebar::after{content:"";width:136px;height:5px;border-radius:3px;background:currentColor}
.homebar.abs{position:absolute;bottom:0;left:0;z-index:20}

/* 비밀번호 */
#pass{z-index:29;color:#fff;align-items:center;overflow:hidden}
.blur{position:absolute;inset:-40px;background:var(--wall) center/cover;filter:blur(26px) brightness(.62)}
#pass>*:not(.blur),#call>*:not(.blur){position:relative}
.ptitle{margin-top:calc(var(--top) + 60px);font-size:20px;font-weight:500}
.pdots{display:flex;gap:22px;margin:22px 0 10px}
.pdots span{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;box-sizing:border-box}.pdots span.on{background:#fff}
.phint{font-size:13px;min-height:18px;opacity:.85}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;margin-top:auto;margin-bottom:22px}
.key{width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .25s}
.key:active{background:rgba(255,255,255,.55);transition:none}
.key b{font-size:34px;font-weight:400}.key small{font-size:10px;letter-spacing:2px;font-weight:600;margin-top:2px;min-height:10px}
.key.blank{visibility:hidden}
.pfoot{width:100%;display:flex;justify-content:space-between;padding:0 50px 30px;box-sizing:border-box}
.pfoot button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}

/* 홈 */
#home{color:#fff;padding:calc(var(--top) + 14px) 22px 0}
#home.enter .apps,#home.enter .dock{animation:homein .45s cubic-bezier(.2,.8,.2,1)}
@keyframes homein{from{transform:scale(1.18);opacity:0}}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;justify-items:center}
.widget{grid-column:span 2;grid-row:span 2;width:100%;aspect-ratio:1;border-radius:22px;background:linear-gradient(180deg,#3a7bd5,#6aa5ec);padding:14px 15px;box-sizing:border-box;display:flex;flex-direction:column;text-align:left;border:0;color:#fff}
.batw{background:rgba(30,30,34,.55)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);align-items:flex-start}
.batw .ring{width:56%;}
.batw .bw{margin-top:auto}.batw b{font-size:26px;font-weight:600;display:block}.batw small{font-size:12px;opacity:.7}
.widget .city{font-size:14px;font-weight:600}.widget .deg{font-size:42px;font-weight:300;line-height:1.05}.widget .wx{margin-top:auto;font-size:12px;font-weight:600;line-height:1.35}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;cursor:pointer;font-size:11.5px;color:#fff;padding:0;width:100%;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.app:active .icon{filter:brightness(.75)}
.icon{position:relative;width:min(62px,100%);aspect-ratio:1;border-radius:23%;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.icon .clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;display:grid;place-items:center}
.icon svg{width:60%}.icon svg.full{width:100%;height:100%}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 6px;box-sizing:border-box;z-index:2;text-shadow:none}
.cal{background:#fff;color:#000;display:flex!important;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cal span{color:#ff3b30;font-size:10px;font-weight:600}.cal b{font-size:30px;font-weight:400;margin-top:1px}
.search{margin:auto auto 14px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:500}
.search svg{width:13px}
.dock{background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-radius:34px;padding:15px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;justify-items:center;margin:0 -10px}
.wiggle{animation:wig .3s}@keyframes wig{30%{transform:scale(.9)}}

/* 앱 공통 */
.appview{z-index:10;background:#fff;color:#000;padding-bottom:26px;transition:transform .42s cubic-bezier(.2,.85,.25,1),opacity .3s,border-radius .42s;overflow:hidden}
.appview.zoomed{transform:scale(.16);opacity:0;border-radius:70px}
.nav{padding:calc(var(--top) + 4px) 16px 0;display:flex;justify-content:space-between;align-items:center;min-height:30px;flex-shrink:0}
.nav button{background:none;border:0;color:#0a84ff;font-size:17px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:2px}
.nav svg{width:13px}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:4px 16px 10px;margin:0;flex-shrink:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.push{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.85,.25,1);box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.push.in{transform:none}

/* 채팅 */
.chathead{padding:calc(var(--top) + 6px) 18px 10px;display:flex;justify-content:space-between;align-items:center}
.chathead h2{margin:0;font-size:22px;font-weight:700}.chathead .ics{display:flex;gap:16px}.chathead svg{width:22px}
.citem{display:flex;gap:12px;align-items:center;padding:9px 18px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.citem:active{background:#f2f2f2}
.ava{width:48px;height:48px;border-radius:18px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:600;font-size:17px}
.cbody{flex:1;min-width:0}.cname{font-size:15px;font-weight:600}
.clast{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.draftic{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:#aaa;flex-shrink:0}
.cnt{background:#ff4b2b;color:#fff;font-size:11px;font-weight:600;border-radius:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;box-sizing:border-box}
.tabbar{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:8px 0 2px;flex-shrink:0}
.tabbar svg{width:24px;color:#bbb}.tabbar svg.on{color:#111}
#room{background:#fff;padding-bottom:26px}
.roomhead{background:#bacee0;padding:calc(var(--top) + 4px) 12px 10px;display:grid;grid-template-columns:40px 1fr 60px;align-items:center;flex-shrink:0}
.roomhead button{background:none;border:0;cursor:pointer;padding:4px;display:flex}.roomhead svg{width:22px}
.roomhead .rt{text-align:center;font-weight:600;font-size:16px}.roomhead .ri{display:flex;gap:12px;justify-content:flex-end}
.roombody{background:#bacee0;flex:1;overflow-y:auto;padding:6px 12px 12px;min-height:0}
.roombody::-webkit-scrollbar{display:none}
.gap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:30px 0 24px}
.gap i{width:3px;height:3px;border-radius:50%;background:#6f7f8e}
.daydiv{margin:12px auto 6px;width:max-content;font-size:11px;color:#fff;background:rgba(0,0,0,.14);padding:4px 12px;border-radius:12px}
.row{display:flex;gap:8px;margin-top:3px}.row.first{margin-top:10px}
.row .ava{width:38px;height:38px;border-radius:15px;font-size:14px}.row .sp{width:38px;flex-shrink:0}
.col{display:flex;flex-direction:column;max-width:72%;min-width:0}
.rname{font-size:12px;color:#3c4a58;margin:0 0 4px 1px}
.line{display:flex;align-items:flex-end;gap:5px}
.row.me{justify-content:flex-end}.row.me .line{max-width:78%}
.bubble{background:#fff;padding:7px 10px;border-radius:13px;font-size:14px;line-height:1.42;word-break:break-word;white-space:pre-wrap;min-width:0}
.me .bubble{background:#fee500}
.first.you .bubble{border-top-left-radius:3px}.first.me .bubble{border-top-right-radius:3px}
.bubble.pic{padding:0;overflow:hidden;width:150px;background:none;border-radius:13px!important}
.bubble.pic img{display:block;width:100%;cursor:pointer}
.bubble.album{width:216px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.bubble.album img{aspect-ratio:1;object-fit:cover;background:#ddd}
.lb{position:absolute;inset:0;z-index:56;background:#000;display:flex;flex-direction:column;color:#fff}
.lbtop{padding:calc(var(--top) + 6px) 16px 8px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.lbtop button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:4px 8px}
.lbimg{flex:1;display:grid;place-items:center;min-height:0;padding-bottom:30px}
.lbimg img{max-width:100%;max-height:100%}
.tm{font-size:10px;color:#4e5d6b;white-space:nowrap;display:flex;flex-direction:column;flex-shrink:0;line-height:1.3}
.me .tm{align-items:flex-end}.rd{color:#d9a400;font-weight:700}
.typing{display:flex;gap:4px;padding:12px}
.typing i{width:6px;height:6px;border-radius:50%;background:#999;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{40%{opacity:.25}}
.composer{display:flex;gap:8px;align-items:center;padding:7px 10px;background:#fff;flex-shrink:0}
.composer .plus{width:28px;height:28px;border:0;background:none;padding:0;cursor:pointer;color:#777}
.composer input{flex:1;min-width:0;border:0;background:#f3f3f3;border-radius:18px;padding:9px 14px;font-size:16px;font-family:inherit;outline:none;-webkit-user-select:text;user-select:text}
.composer input{color:#000;-webkit-text-fill-color:#000}
.composer input:disabled{color:#000;-webkit-text-fill-color:#000;opacity:1}
.composer .send{width:34px;height:34px;border-radius:50%;border:0;background:#fee500;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.composer .send[disabled]{background:#eee;cursor:default}.composer .send svg{width:15px}

/* 전화 */
#phoneapp .seg{display:flex;background:#eeeef0;border-radius:9px;padding:2px;font-size:13px;font-weight:600}
#phoneapp .seg span{padding:5px 18px;border-radius:7px}#phoneapp .seg span.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.crow{display:flex;align-items:center;gap:12px;padding:0 16px;width:100%;border:0;background:none;text-align:left;cursor:pointer;box-sizing:border-box}
.crow:active{background:#f2f2f7}
.crow .cb{flex:1;border-bottom:1px solid #e5e5ea;padding:10px 0;display:flex;align-items:center;gap:10px;min-width:0}
.crow .cn{font-size:17px;font-weight:600}.crow .cn.miss{color:#ff3b30}
.crow .cs{font-size:14px;color:#8e8e93}.crow .cw{margin-left:auto;font-size:15px;color:#8e8e93;white-space:nowrap}
.cdet{font-size:13px;color:#0a84ff;margin-top:3px}
.crow .info{display:flex;padding:6px;margin:-6px}
.crow svg{width:22px;flex-shrink:0}
.tabs5{display:flex;justify-content:space-around;border-top:1px solid #e5e5ea;padding:6px 0 0;flex-shrink:0}
.tabs5 button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#999;background:none;border:0;cursor:pointer;padding:0}
.tabs5 svg{width:24px}.tabs5 .on{color:#0a84ff}

/* 통화 화면 */
#incoming{z-index:58;color:#fff;align-items:center;overflow:hidden;background:#111}
#incoming>*:not(.blur){position:relative}
#incoming .blur{filter:blur(30px) brightness(.4)}
.ibtns{display:flex;justify-content:space-around;width:100%;margin-top:auto;margin-bottom:70px}
.ibtns>div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px}
.ibtn{width:74px;height:74px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:32px}.ibtn.no{background:#ff3b30}.ibtn.yes{background:#34c759}
.ibtn.yes{animation:ring 1.2s infinite}
@keyframes ring{0%,100%{transform:none}10%,30%{transform:rotate(-12deg)}20%,40%{transform:rotate(12deg)}50%{transform:none}}
.batalert{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.25);display:grid;place-items:center}
.ba{width:270px;background:rgba(242,242,247,.96);border-radius:14px;text-align:center;color:#000;overflow:hidden;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.ba b{display:block;font-size:17px;padding:18px 16px 2px}
.ba span{display:block;font-size:13px;padding:0 16px 16px}
.bab{display:flex;border-top:1px solid #c6c6c8}
.bab button{flex:1;border:0;background:none;padding:11px;font-size:17px;color:#0a84ff;cursor:pointer}
.bab button+button{border-left:1px solid #c6c6c8;font-weight:600}
.off{position:absolute;inset:0;z-index:90;background:#000;display:grid;place-items:center;opacity:0;transition:opacity 1.2s}
.off.on{opacity:1}
.off svg{opacity:0;transition:opacity .4s}
.off.icon svg{opacity:1}
#call{z-index:57;color:#fff;align-items:center;overflow:hidden;background:#111}
#call .blur{filter:blur(30px) brightness(.4)}
.callname{margin-top:calc(var(--top) + 34px);font-size:32px;font-weight:500}
.callstat{font-size:16px;opacity:.75;margin-top:6px;font-variant-numeric:tabular-nums}
.script{flex:1;width:100%;overflow-y:auto;padding:20px 26px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;min-height:0}
.script::-webkit-scrollbar{display:none}
.tl{animation:tin .45s both;max-width:85%}
.tl small{display:block;font-size:11px;opacity:.55;margin-bottom:2px}
.tl span{font-size:16px;line-height:1.45}
.tl.me{align-self:flex-end;text-align:right}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.cbtns{display:flex;gap:26px;margin:4px 0 20px}
.cbtns div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.cbtns span{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.cbtns svg{width:28px}
.endbtn{width:72px;height:72px;border-radius:50%;background:#ff3b30;border:0;display:grid;place-items:center;cursor:pointer;margin-bottom:34px;flex-shrink:0}
.endbtn svg{width:32px;transform:rotate(135deg)}

/* 메모 */
#notes{background:#f2f2f7}
#notes .nav button,#notedetail .nav button{color:#e0a800}
.ncard{background:#fff;border-radius:12px;margin:0 16px 16px;overflow:hidden}
.nrow{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 16px;cursor:pointer}
.nrow b{display:block;font-size:16px;font-weight:600}
.nrow small{display:block;font-size:14px;color:#8e8e93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncount{font-size:12px;color:#8e8e93;text-align:center;padding:8px}
#notedetail{background:#fff}
.ndate{text-align:center;font-size:13px;color:#8e8e93;margin:8px 0 14px}
.ntitle{font-size:26px;font-weight:700;padding:0 20px;margin:0 0 8px}
.ntext{font-size:17px;line-height:1.6;padding:0 20px;white-space:pre-line;margin:0}

/* 사진 */
.psub{font-size:14px;color:#8e8e93;padding:0 16px 10px;font-weight:600;margin-top:-6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid button{border:0;padding:0;cursor:pointer;aspect-ratio:1;max-width:100%;background:#eee}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
#viewer{background:#000;color:#fff;box-shadow:none;touch-action:pan-y}
#viewer .nav button{color:#fff}
#viewer .vt{text-align:center;font-size:14px;font-weight:600;line-height:1.3}
#viewer .vt small{display:block;font-weight:400;opacity:.7;font-size:12px}
.stage{flex:1;display:grid;place-items:center;min-height:0;padding:10px 0}
.stage img,.stage video{max-width:100%;max-height:100%;display:block}
.grid button{position:relative}

function paint(type,seed,w,h){

  P[type](c,w,h,rng(seed*997+13));

const callCount={};
let callTimers=[],callStart=0,callTick=null,inCall=false;
function later(fn,ms){callTimers.push(setTimeout(fn,ms))}
function addLine(who,text,name){
  const d=document.createElement("div");d.className="tl"+(who==="me"?" me":"");
  d.innerHTML="<small></small><span></span>";d.querySelector("small").textContent=who==="me"?"도연":name;d.querySelector("span").textContent=text;
  $("script").appendChild(d);$("script").scrollTop=$("script").scrollHeight;
}
const callDone={};
function startCall(name,incoming){
  if(inCall||ended)return;inCall=true;
  $("callName").textContent=name;$("callStat").textContent=incoming?"":"휴대전화 연결 중…";$("script").innerHTML="";
  $("call").hidden=false;setStatus(true);
  const entry=[name,"휴대전화",korTime(),false,korTime()+(incoming?" · 수신 전화":" · 발신 전화")];CALLS.unshift(entry);
  const need=CALL_NEEDS_TEXT[name],ok=!need||chatById(need)._sent;
  const set=ok?CALL_SCRIPTS[name]:null,d=callDone[name]||0;
  let lines=set?set[Math.min(d,set.length-1)]:null;
  if(name==="나은이"&&d===0&&lines&&!/사진/.test(chatById("naeun")._sentText||""))lines=NAEUN_ALT;
  if(!lines){later(()=>{$("callStat").textContent="응답 없음";later(()=>endCall(false,true),1000)},3000);return}
  later(()=>{
    callDone[name]=d+1;
    if(name==="나은이"&&d===0&&lines!==NAEUN_ALT)photosPending=true;
    callStart=Date.now();
    const t=()=>{const s=Math.floor((Date.now()-callStart)/1000);$("callStat").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
    t();callTick=setInterval(t,1000);
    let at=700;
    lines.forEach(([who,text,key])=>{later(()=>{addLine(who,text,name);if(key)unlocked[key]=true},at);at+=1400+text.length*90});
    later(()=>{entry[4]+=" · "+Math.max(1,Math.round(lines.length*.7))+"분";endCall()},at+1500);
  },incoming?500:4200);
}
let photosPending=false;
function sendNaeunPhotos(){if(!photosPending)return;photosPending=false;
  setTimeout(()=>{receive("naeun","ALBUM:"+NAEUN_PHOTOS.join(","));saveToAlbum(NAEUN_PHOTOS)},2500)}
function endCall(silent,noAnswer){
  if(!inCall)return;
  sendNaeunPhotos();
  callTimers.forEach(clearTimeout);callTimers=[];clearInterval(callTick);inCall=false;
  if(silent){$("call").hidden=true;return}
  if(!noAnswer)$("callStat").textContent="통화 종료";
  setTimeout(maybeShutdown,1400);
  setTimeout(()=>{$("call").hidden=true;setStatus(!openId||LIGHT_APPS.includes(openId));if(openId==="phoneapp")renderPhone()},1000);
}
$("endBtn").onclick=()=>endCall();

/* ---------- 사진 ---------- */
$("psub").textContent=today.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});
const isVid=n=>/\.(mp4|mov)$/i.test(n);
const variants=nameVariants;
function setSrc(el,name){const list=variants(name);let i=0;el.onerror=()=>{if(++i<list.length)el.src=list[i]};el.src=list[0]}
const album=PHOTOS.filter(p=>!DELETED_PHOTOS.includes(parseInt(p[0]))).concat(NEW_PHOTOS).map(p=>({file:p[0],video:isVid(p[0]),thumb:()=>paint(p[0],p[1],240,240),full:()=>paint(p[0],p[1],600,800),cap:p[2],date:p[3]}));
let pIdx=0;
function renderGrid(){$("grid").innerHTML="";album.forEach((p,i)=>{const b=document.createElement("button");b.setAttribute("aria-label","사진");if(p.video){const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="metadata";const len=document.createElement("span");len.className="vlen";
    v.addEventListener("loadedmetadata",()=>{if(isFinite(v.duration))len.textContent=vfmt(v.duration);try{v.currentTime=.1}catch(e){}});
    setSrc(v,p.file);b.append(v,len);b.setAttribute("aria-label","동영상")}
  else{const img=new Image();img.alt="";if(p.file&&p.file.includes("."))setSrc(img,p.file);else img.src=p.thumb();b.appendChild(img)}
  b.onclick=()=>{pIdx=i;showPhoto();$("viewer").classList.add("in")};$("grid").appendChild(b)})}
renderGrid();
function showPhoto(){const p=album[pIdx],[d,t]=p.date.split(/ (?=오[전후])/);const vv=$("vvid");vv.pause();vv.hidden=!p.video;$("vimg").hidden=!!p.video;if(p.video)setSrc(vv,p.file);else if(p.file&&p.file.includes("."))setSrc($("vimg"),p.file);else $("vimg").src=p.full();$("vtitle").innerHTML="";$("vtitle").append(d||"");if(t){const s=document.createElement("small");s.textContent=t;$("vtitle").appendChild(s)}$("vcap").textContent=p.cap}
function photosToBottom(){const sc=$("pscroll"),go=()=>sc.scrollTop=sc.scrollHeight;go();requestAnimationFrame(go);setTimeout(go,120);setTimeout(go,450)}
$("viewBack").onclick=()=>{$("vvid").pause();$("viewer").classList.remove("in")};
let px=null;
$("stage").addEventListener("pointerdown",e=>px=e.clientX);
$("stage").addEventListener("pointerup",e=>{if(px===null)return;const dx=e.clientX-px;px=null;const w=$("stage").getBoundingClientRect();
  if(album[pIdx].video&&Math.abs(dx)<30)return;
  if(dx<-30||(Math.abs(dx)<6&&e.clientX>w.left+w.width/2))pIdx=Math.min(album.length-1,pIdx+1);else pIdx=Math.max(0,pIdx-1);showPhoto()});

/* ---------- 카메라 ---------- */
let stream=null,facing="environment";
async function startCam(){
  $("cammsg").hidden=false;$("cammsg").textContent="카메라를 켜는 중…";
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("none");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});
    if(openId!=="camera"){stopCam();return}
    const v=$("cam");v.srcObject=stream;v.classList.toggle("mirror",facing==="user");await v.play().catch(()=>{});
    $("cammsg").hidden=true;
  }catch(err){
    $("cammsg").textContent="카메라를 켤 수 없어요.\n브라우저에서 카메라 권한을 허용해 주세요.";
  }
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("cam").srcObject=null}
$("flip").onclick=()=>{facing=facing==="environment"?"user":"environment";stopCam();startCam()};
$("shutter").onclick=()=>{
  const v=$("cam");$("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");
  if(!stream||!v.videoWidth)return;
  const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext("2d");
  if(facing==="user"){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(v,0,0);
  const url=c.toDataURL("image/jpeg",.9);
  album.push({thumb:()=>url,full:()=>url,cap:"",date:today.toLocaleDateString("ko-KR",{month:"long",day:"numeric"})+" "+korTime()});
  $("thumb").style.backgroundImage=`url(${url})`;renderGrid();
};

/* ---------- 캘린더 ---------- */
const unlocked={meet:false,cmeet:false};
let calY,calM,sel;
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
function eventDate(when){
  if(Array.isArray(when))return new Date(when[0],when[1]-1,when[2]);
  if(when==="tomorrow")return addDays(today,1);
  if(when==="nextSat"){const toMon=((8-today.getDay())%7)||7;return addDays(today,toMon+5)}
  return new Date(when);
}
const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const eventsOn=d=>CAL_EVENTS.filter(e=>(e.key==="always"||unlocked[e.key])&&(e.yearly?(d.getMonth()+1===e.yearly[0]&&d.getDate()===e.yearly[1]):same(eventDate(e.when),d)));
function renderCal(){
  $("calMonth").textContent=`${calY}년 ${calM+1}월`;
  const box=$("calDays");box.innerHTML="";
  const first=new Date(calY,calM,1).getDay(),n=new Date(calY,calM+1,0).getDate();
  for(let i=0;i<first;i++)box.appendChild(document.createElement("span"));
  for(let d=1;d<=n;d++){
    const date=new Date(calY,calM,d),b=document.createElement("button"),dow=date.getDay();
    b.className=(same(date,today)?"today ":"")+(same(date,sel)?"sel ":"")+(dow===0||dow===6?"weekend":"");
    b.innerHTML=`<span>${d}</span>${eventsOn(date).length?"<i></i>":""}`;
    b.onclick=()=>{sel=date;renderCal()};box.appendChild(b);
  }
  const evs=$("calEvs"),list=eventsOn(sel);
  evs.innerHTML=`<div class="evday">${sel.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"})}</div>`;
  if(!list.length)evs.insertAdjacentHTML("beforeend",'<div class="noev">일정 없음</div>');
  list.forEach(e=>{const d=document.createElement("div");d.className="ev";d.innerHTML=`<span class="bar" style="background:${e.color}"></span><span><b></b><small>하루 종일${e.note?" · "+e.note:""}</small></span>`;d.querySelector("b").textContent=e.title;evs.appendChild(d)});
}
$("calPrev").onclick=()=>{calM--;if(calM<0){calM=11;calY--}renderCal()};
$("calNext").onclick=()=>{calM++;if(calM>11){calM=0;calY++}renderCal()};

/* ---------- 음성 메모 ---------- */
let vAudio=null,vIdx=-1,vPos=0,vPlaying=false,vTimer=null;
const vfmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const vbars=(()=>{const R=rng(77);return Array.from({length:60},(_,i)=>8+Math.abs(Math.sin(i*.45))*28*R()+R()*14)})();
function renderVoice(){
  const list=$("vlist");list.innerHTML="";
  VOICE_MEMOS.forEach((m,i)=>{
    const row=document.createElement("div");row.className="vrow";
    row.innerHTML=`<button class="vhead"><span><b></b><small>${m.date}</small></span><span class="vd">${vfmt(m.len)}</span></button>`;
    row.querySelector("b").textContent=m.title;
    if(i===vIdx){
      row.insertAdjacentHTML("beforeend",`<div class="vbody"><div class="wave">${vbars.map(h=>`<i style="height:${h}px"></i>`).join("")}</div>
        <div class="vtimes"><span class="vc"></span><span class="vl"></span></div>
        <div class="vctl"><button class="vback" aria-label="15초 뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8"><path d="M4 12a8 8 0 108-8H8M10 1L7 4l3 3"/></svg></button>
        <button class="vp" aria-label="재생"><svg viewBox="0 0 24 24" fill="#000">${vPlaying?'<path d="M6 3h4v18H6zM14 3h4v18h-4z"/>':'<path d="M6 3l15 9-15 9z"/>'}</svg></button>
        <button class="vfwd" aria-label="15초 앞으로"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8"><path d="M20 12a8 8 0 11-8-8h4M14 1l3 3-3 3"/></svg></button></div></div>`);
      row.querySelector(".vp").onclick=togglePlay;
      row.querySelector(".vback").onclick=()=>seek(vPos-15);
      row.querySelector(".vfwd").onclick=()=>seek(vPos+15);
      row.querySelector(".wave").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seek((e.clientX-r.left)/r.width*m.len)};
    }
    row.querySelector(".vhead").onclick=()=>{if(vIdx===i)return;stopVoice();vIdx=i;vPos=0;loadAudio();renderVoice()};
    list.appendChild(row);
  });
  drawVoicePos();
}
function loadAudio(){
  const m=VOICE_MEMOS[vIdx];vAudio=null;if(!m.file)return;
  const a=new Audio();a.preload="metadata";
  a.addEventListener("loadedmetadata",()=>{if(isFinite(a.duration)&&a.duration>0){m.len=a.duration;renderVoice()}});
  a.addEventListener("error",()=>{if(vAudio!==a)return;if(/\.m4a$/i.test(a.src)&&!a._tried){a._tried=true;a.src=m.file.replace(/\.m4a$/i,".mp3");return}vAudio=null});
  a.addEventListener("ended",()=>{vPlaying=false;vPos=0;renderVoice()});
  a.src=m.file;vAudio=a;
}
function drawVoicePos(){
  const row=$("vlist").querySelector(".vbody");if(!row)return;const m=VOICE_MEMOS[vIdx];
  row.querySelector(".vc").textContent=vfmt(vPos);row.querySelector(".vl").textContent="-"+vfmt(m.len-vPos);
  const n=Math.round(vPos/m.len*vbars.length);row.querySelectorAll(".wave i").forEach((b,i)=>b.classList.toggle("on",i<n));
}
function seek(t){const m=VOICE_MEMOS[vIdx];vPos=Math.max(0,Math.min(m.len,t));if(vAudio)try{vAudio.currentTime=vPos}catch(e){}drawVoicePos()}
function togglePlay(){
  const m=VOICE_MEMOS[vIdx];
  if(vPlaying){stopVoice(true);renderVoice();return}
  vPlaying=true;
  if(vAudio){try{vAudio.currentTime=vPos}catch(e){}vAudio.play().catch(()=>{vAudio=null})}
  clearInterval(vTimer);
  vTimer=setInterval(()=>{
    if(vAudio&&!vAudio.paused)vPos=vAudio.currentTime;else vPos+=.2;
    if(vPos>=m.len){stopVoice(true);vPos=0;renderVoice();return}
    drawVoicePos();
  },200);
  renderVoice();
}
function stopVoice(keep){vPlaying=false;clearInterval(vTimer);if(vAudio)vAudio.pause();if(!keep&&false)vIdx=-1}
renderVoice();

/* ---------- 인터넷 ---------- */
const clockIcon='<svg viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
SEARCHES.forEach(s=>{const d=document.createElement("div");d.className="ritem";d.innerHTML=clockIcon+"<span></span>";d.querySelector("span").textContent=s;$("rlist").appendChild(d)});
$("urlbar").onclick=()=>$("searchpanel").classList.add("in");
$("searchCancel").onclick=()=>$("searchpanel").classList.remove("in");

/* ---------- 음악 (재생 화면만, 소리는 안 나와요) ---------- */
let si=0,pos=48,playing=false,mt;
function fmt(s){return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
function setCover(s){
  const fallback=paint(s.art[0],s.art[1],500,500);
  const put=u=>{if(SONGS[si]!==s)return;$("mcover").src=u;$("mbg").style.backgroundImage=`url("${u}")`};
  if(s._ok){put(s.cover);return}
  put(fallback);
  if(s.cover&&!s._bad){s._bad=true;loadImg(s.cover,u=>{s._ok=true;s._bad=false;s.cover=u;put(u)})}
}
function drawSong(){const s=SONGS[si];$("mtitle").textContent=s.title;$("martist").textContent=s.artist;setCover(s);
  [...$("mlist").children].forEach((b,i)=>b.classList.toggle("on",i===si));drawPos()}
function drawPos(){const s=SONGS[si];$("mbar").style.width=(pos/s.len*100)+"%";$("mcur").textContent=fmt(pos);$("mleft").textContent="-"+fmt(s.len-pos)}
function stopMusic(){playing=false;clearInterval(mt);$("ppicon").innerHTML='<path d="M6 3l15 9-15 9z"/>';$("mcover").classList.add("paused")}
$("mplay").onclick=()=>{if(playing){stopMusic();return}playing=true;$("ppicon").innerHTML='<path d="M6 3h4v18H6zM14 3h4v18h-4z"/>';$("mcover").classList.remove("paused");
  mt=setInterval(()=>{pos++;if(pos>=SONGS[si].len){si=(si+1)%SONGS.length;pos=0;drawSong()}drawPos()},1000)};
$("mnext").onclick=()=>{si=(si+1)%SONGS.length;pos=0;drawSong()};
$("mprev").onclick=()=>{if(pos>3)pos=0;else{si=(si-1+SONGS.length)%SONGS.length;pos=0}drawSong()};
SONGS.forEach((s,i)=>{const b=document.createElement("button");b.innerHTML="<span></span><small></small>";b.querySelector("span").textContent=s.title;b.querySelector("small").textContent=s.artist;
  b.onclick=()=>{si=i;pos=0;drawSong()};$("mlist").appendChild(b)});
drawSong();updateBadges();

/* ---------- 배터리 & 엔딩 ---------- */
let battery=BATTERY_START,ended=false,dying=false,lowPower=false;
const STEP=BATTERY_START/BATTERY_TAPS,WARN=[20,10,5,1];
function drawBattery(){const b=Math.max(0,Math.ceil(battery));$("batPct").textContent=b;
  const w=$("batW");if(w){w.textContent=b+"%";const r=$("batRing");r.setAttribute("stroke-dashoffset",251.3*(1-b/100));r.setAttribute("stroke",lowPower?"#ffcc00":b<=20?"#ff3b30":"#34c759")}
  const f=$("batFill");f.setAttribute("width",Math.max(1,20*b/100));f.setAttribute("fill",lowPower?"#ffcc00":b<=20?"#ff3b30":"currentColor")}
drawBattery();
screen.addEventListener("click",e=>{
  if(ended||dying||!$("lock").hidden||!$("pass").hidden||!$("batAlert").hidden||e.target.closest("#batAlert"))return;
  if(!e.target.closest("button")||e.target.closest("#msgInput"))return;
  const before=battery;battery=Math.max(0,battery-STEP);drawBattery();
  const w=WARN.find(x=>before>x&&battery<=x);
  if(w&&battery>0)setTimeout(()=>iosAlert("배터리 부족",`배터리 잔량 ${w}%`,!lowPower),250);
  if(battery<=0)maybeShutdown();
},true);
function iosAlert(title,msg,showLow){$("batTitle").textContent=title;$("batMsg").textContent=msg;$("batLow").hidden=!showLow;$("batAlert").hidden=false}
$("batClose").onclick=()=>$("batAlert").hidden=true;
$("batLow").onclick=()=>{lowPower=true;$("batAlert").hidden=true;drawBattery()};
function maybeShutdown(){
  if(battery>0||ended||dying)return;
  if(inCall||!$("incoming").hidden){setTimeout(maybeShutdown,800);return}
  dying=true;$("batAlert").hidden=true;
  const off=$("off");off.hidden=false;void off.offsetWidth;off.classList.add("on");
  setTimeout(()=>off.classList.add("icon"),1300);
  setTimeout(()=>{
    lockPhone();ended=true;ENDED_AT=MORNING.getTime();
    $("notis").innerHTML="";const end=ENDINGS[route||"none"];
    if(end){const ch=chatById(end.chat);end.texts.forEach((t,i)=>setTimeout(()=>{
      const d=document.createElement("div");d.className="noti new";d.innerHTML=notiHTML(ch,"지금");d.querySelector(".nx").textContent=t;
      $("notis").appendChild(d)},4600+i*2600))}
    if(end&&end.wall)loadImg(end.wall,u=>screen.style.setProperty("--wall",`url("${u}")`));
    battery=76;drawBattery();tick();$("swipeBtn").style.visibility="hidden";
    off.classList.remove("icon");
  },3600);
  setTimeout(()=>{off.classList.remove("on")},5200);
  setTimeout(()=>{off.hidden=true},6600);
}
