<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>도연의 폰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--top:50px;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:#16141c;color:#9a94aa;font-family:var(--ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 16px;box-sizing:border-box;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hint{font-size:13px;margin:0;text-align:center}.hint b{color:#e8e3f3}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}

.phone{position:relative;height:min(844px,calc(100% - 40px));aspect-ratio:390/844;max-width:100%;background:#0b0a0e;border-radius:58px;padding:11px;box-sizing:border-box;box-shadow:0 40px 80px rgba(0,0,0,.55),inset 0 0 0 2px #3a3644,inset 0 0 0 6px #121016}
.side{position:absolute;width:4px;background:#2a2732;border-radius:2px;border:0;padding:0}
.side.l1{left:-3px;top:18%;height:5%}.side.l2{left:-3px;top:26%;height:9%}.side.l3{left:-3px;top:37%;height:9%}.side.r{right:-3px;top:27%;height:13%;cursor:pointer}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:#000;color:#000;--wall:linear-gradient(160deg,#ff7a59,#6c4a9e 55%,#2b2a6e)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 36px;box-sizing:border-box;font-size:16px;font-weight:600;z-index:59;font-variant-numeric:tabular-nums;color:#000;pointer-events:none;transition:color .3s}
.status.light{color:#fff}.status .right{display:flex;gap:6px;align-items:center}
.view{position:absolute;inset:0;display:flex;flex-direction:column;box-sizing:border-box}
.wall{background:var(--wall) center/cover}

/* 잠금 */
#lock{color:#fff;z-index:30;touch-action:none}
#lockInner{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--top) + 18px);transition:transform .3s,opacity .3s}
#lock.drag #lockInner{transition:none}
.ldate{font-size:19px;font-weight:600;opacity:.92}
.ltime{font-size:92px;font-weight:700;line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums;margin-top:2px}
.notis{margin-top:auto;width:100%;padding:0 10px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.noti{background:rgba(250,250,252,.62);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border-radius:22px;padding:11px 14px;display:flex;gap:11px;color:#111;text-align:left;border:0;width:100%;box-sizing:border-box}
.noti .ni{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:grid;place-items:center}.noti .ni svg{width:62%}
.noti .nb{flex:1;min-width:0}
.noti .nt{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:600}
.noti .nt span{font-weight:400;font-size:13px;color:#555}
.noti .nx{font-size:14.5px;line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lockbottom{width:100%;display:flex;justify-content:space-between;padding:20px 46px 6px;box-sizing:border-box}
.round{width:50px;height:50px;border-radius:50%;background:rgba(30,30,40,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;place-items:center;border:0;cursor:pointer}.round svg{width:22px}
.swipe{font-size:14px;opacity:.85;padding:6px 0 4px;background:none;border:0;cursor:pointer;color:#fff}
.homebar{height:26px;width:100%;display:grid;place-items:center;border:0;background:none;cursor:pointer;flex-shrink:0;padding:0;touch-action:none}
.homebar::after{content:"";width:136px;height:5px;border-radius:3px;background:currentColor}
.homebar.abs{position:absolute;bottom:0;left:0;z-index:20}

/* 비밀번호 */
#pass{z-index:29;color:#fff;align-items:center;overflow:hidden}
.blur{position:absolute;inset:-40px;background:var(--wall) center/cover;filter:blur(26px) brightness(.62)}
#pass>*:not(.blur),#call>*:not(.blur){position:relative}
.ptitle{margin-top:calc(var(--top) + 60px);font-size:20px;font-weight:500}
.pdots{display:flex;gap:22px;margin:22px 0 10px}
.pdots span{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;box-sizing:border-box}.pdots span.on{background:#fff}
.phint{font-size:13px;min-height:18px;opacity:.85}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;margin-top:auto;margin-bottom:22px}
.key{width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .25s}
.key:active{background:rgba(255,255,255,.55);transition:none}
.key b{font-size:34px;font-weight:400}.key small{font-size:10px;letter-spacing:2px;font-weight:600;margin-top:2px;min-height:10px}
.key.blank{visibility:hidden}
.pfoot{width:100%;display:flex;justify-content:space-between;padding:0 50px 30px;box-sizing:border-box}
.pfoot button{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}

/* 홈 */
#home{color:#fff;padding:calc(var(--top) + 14px) 22px 0}
#home.enter .apps,#home.enter .dock{animation:homein .45s cubic-bezier(.2,.8,.2,1)}
@keyframes homein{from{transform:scale(1.18);opacity:0}}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;justify-items:center}
.widget{grid-column:span 2;grid-row:span 2;width:100%;aspect-ratio:1;border-radius:22px;background:linear-gradient(180deg,#3a7bd5,#6aa5ec);padding:14px 15px;box-sizing:border-box;display:flex;flex-direction:column;text-align:left;border:0;color:#fff}
.widget .city{font-size:14px;font-weight:600}.widget .deg{font-size:42px;font-weight:300;line-height:1.05}.widget .wx{margin-top:auto;font-size:12px;font-weight:600;line-height:1.35}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;cursor:pointer;font-size:11.5px;color:#fff;padding:0;width:100%;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.app:active .icon{filter:brightness(.75)}
.icon{position:relative;width:min(62px,100%);aspect-ratio:1;border-radius:23%;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.icon .clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;display:grid;place-items:center}
.icon svg{width:60%}.icon svg.full{width:100%;height:100%}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 6px;box-sizing:border-box;z-index:2;text-shadow:none}
.cal{background:#fff;color:#000;display:flex!important;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cal span{color:#ff3b30;font-size:10px;font-weight:600}.cal b{font-size:30px;font-weight:400;margin-top:1px}
.search{margin:auto auto 14px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:500}
.search svg{width:13px}
.dock{background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-radius:34px;padding:15px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;justify-items:center;margin:0 -10px}
.wiggle{animation:wig .3s}@keyframes wig{30%{transform:scale(.9)}}

/* 앱 공통 */
.appview{z-index:10;background:#fff;color:#000;padding-bottom:26px;transition:transform .42s cubic-bezier(.2,.85,.25,1),opacity .3s,border-radius .42s;overflow:hidden}
.appview.zoomed{transform:scale(.16);opacity:0;border-radius:70px}
.nav{padding:calc(var(--top) + 4px) 16px 0;display:flex;justify-content:space-between;align-items:center;min-height:30px;flex-shrink:0}
.nav button{background:none;border:0;color:#0a84ff;font-size:17px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:2px}
.nav svg{width:13px}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:4px 16px 10px;margin:0;flex-shrink:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.push{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.85,.25,1);box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.push.in{transform:none}

/* 채팅 */
.chathead{padding:calc(var(--top) + 6px) 18px 10px;display:flex;justify-content:space-between;align-items:center}
.chathead h2{margin:0;font-size:22px;font-weight:700}.chathead .ics{display:flex;gap:16px}.chathead svg{width:22px}
.citem{display:flex;gap:12px;align-items:center;padding:9px 18px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.citem:active{background:#f2f2f2}
.ava{width:48px;height:48px;border-radius:18px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:600;font-size:17px}
.cbody{flex:1;min-width:0}.cname{font-size:15px;font-weight:600}
.clast{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:#aaa;flex-shrink:0}
.cnt{background:#ff4b2b;color:#fff;font-size:11px;font-weight:600;border-radius:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;box-sizing:border-box}
.tabbar{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:8px 0 2px;flex-shrink:0}
.tabbar svg{width:24px;color:#bbb}.tabbar svg.on{color:#111}
#room{background:#fff}
.roomhead{background:#bacee0;padding:calc(var(--top) + 4px) 12px 10px;display:grid;grid-template-columns:40px 1fr 60px;align-items:center;flex-shrink:0}
.roomhead button{background:none;border:0;cursor:pointer;padding:4px;display:flex}.roomhead svg{width:22px}
.roomhead .rt{text-align:center;font-weight:600;font-size:16px}.roomhead .ri{display:flex;gap:12px;justify-content:flex-end}
.roombody{background:#bacee0;flex:1;overflow-y:auto;padding:6px 12px 12px;min-height:0}
.roombody::-webkit-scrollbar{display:none}
.daydiv{margin:12px auto 6px;width:max-content;font-size:11px;color:#fff;background:rgba(0,0,0,.14);padding:4px 12px;border-radius:12px}
.row{display:flex;gap:8px;margin-top:3px}.row.first{margin-top:10px}
.row .ava{width:38px;height:38px;border-radius:15px;font-size:14px}.row .sp{width:38px;flex-shrink:0}
.col{display:flex;flex-direction:column;max-width:72%;min-width:0}
.rname{font-size:12px;color:#3c4a58;margin:0 0 4px 1px}
.line{display:flex;align-items:flex-end;gap:5px}
.row.me{justify-content:flex-end}.row.me .line{max-width:78%}
.bubble{background:#fff;padding:7px 10px;border-radius:13px;font-size:14px;line-height:1.42;word-break:break-word;white-space:pre-wrap;min-width:0}
.me .bubble{background:#fee500}
.first.you .bubble{border-top-left-radius:3px}.first.me .bubble{border-top-right-radius:3px}
.bubble.pic{padding:0;overflow:hidden;width:150px;background:none;border-radius:13px!important}
.bubble.pic img{display:block;width:100%}
.tm{font-size:10px;color:#4e5d6b;white-space:nowrap;display:flex;flex-direction:column;flex-shrink:0;line-height:1.3}
.me .tm{align-items:flex-end}.rd{color:#d9a400;font-weight:700}
.typing{display:flex;gap:4px;padding:12px}
.typing i{width:6px;height:6px;border-radius:50%;background:#999;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{40%{opacity:.25}}
.composer{display:flex;gap:8px;align-items:center;padding:7px 10px;background:#fff;flex-shrink:0}
.composer .plus{width:28px;height:28px;border:0;background:none;padding:0;cursor:pointer;color:#777}
.composer input{flex:1;min-width:0;border:0;background:#f3f3f3;border-radius:18px;padding:9px 14px;font-size:16px;font-family:inherit;outline:none;-webkit-user-select:text;user-select:text}
.composer .send{width:34px;height:34px;border-radius:50%;border:0;background:#fee500;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.composer .send[disabled]{background:#eee;cursor:default}.composer .send svg{width:15px}

/* 전화 */
#phoneapp .seg{display:flex;background:#eeeef0;border-radius:9px;padding:2px;font-size:13px;font-weight:600}
#phoneapp .seg span{padding:5px 18px;border-radius:7px}#phoneapp .seg span.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.crow{display:flex;align-items:center;gap:12px;padding:0 16px;width:100%;border:0;background:none;text-align:left;cursor:pointer;box-sizing:border-box}
.crow:active{background:#f2f2f7}
.crow .cb{flex:1;border-bottom:1px solid #e5e5ea;padding:10px 0;display:flex;align-items:center;gap:10px;min-width:0}
.crow .cn{font-size:17px;font-weight:600}.crow .cn.miss{color:#ff3b30}
.crow .cs{font-size:14px;color:#8e8e93}.crow .cw{margin-left:auto;font-size:15px;color:#8e8e93;white-space:nowrap}
.crow svg{width:22px;flex-shrink:0}
.tabs5{display:flex;justify-content:space-around;border-top:1px solid #e5e5ea;padding:6px 0 0;flex-shrink:0}
.tabs5 button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#999;background:none;border:0;cursor:pointer;padding:0}
.tabs5 svg{width:24px}.tabs5 .on{color:#0a84ff}

/* 통화 화면 */
#call{z-index:57;color:#fff;align-items:center;overflow:hidden;background:#111}
#call .blur{filter:blur(30px) brightness(.4)}
.callname{margin-top:calc(var(--top) + 34px);font-size:32px;font-weight:500}
.callstat{font-size:16px;opacity:.75;margin-top:6px;font-variant-numeric:tabular-nums}
.script{flex:1;width:100%;overflow-y:auto;padding:20px 26px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;min-height:0}
.script::-webkit-scrollbar{display:none}
.tl{animation:tin .45s both;max-width:85%}
.tl small{display:block;font-size:11px;opacity:.55;margin-bottom:2px}
.tl span{font-size:16px;line-height:1.45}
.tl.me{align-self:flex-end;text-align:right}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.cbtns{display:flex;gap:26px;margin:4px 0 20px}
.cbtns div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.cbtns span{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.cbtns svg{width:28px}
.endbtn{width:72px;height:72px;border-radius:50%;background:#ff3b30;border:0;display:grid;place-items:center;cursor:pointer;margin-bottom:34px;flex-shrink:0}
.endbtn svg{width:32px;transform:rotate(135deg)}

/* 메모 */
#notes{background:#f2f2f7}
#notes .nav button,#notedetail .nav button{color:#e0a800}
.ncard{background:#fff;border-radius:12px;margin:0 16px 16px;overflow:hidden}
.nrow{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 16px;cursor:pointer}
.nrow b{display:block;font-size:16px;font-weight:600}
.nrow small{display:block;font-size:14px;color:#8e8e93;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncount{font-size:12px;color:#8e8e93;text-align:center;padding:8px}
#notedetail{background:#fff}
.ndate{text-align:center;font-size:13px;color:#8e8e93;margin:8px 0 14px}
.ntitle{font-size:26px;font-weight:700;padding:0 20px;margin:0 0 8px}
.ntext{font-size:17px;line-height:1.6;padding:0 20px;white-space:pre-line;margin:0}

/* 사진 */
.psub{font-size:14px;color:#8e8e93;padding:0 16px 10px;font-weight:600;margin-top:-6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid button{border:0;padding:0;cursor:pointer;aspect-ratio:1;max-width:100%;background:#eee}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
#viewer{background:#000;color:#fff;box-shadow:none;touch-action:pan-y}
#viewer .nav button{color:#fff}
#viewer .vt{text-align:center;font-size:14px;font-weight:600;line-height:1.3}
#viewer .vt small{display:block;font-weight:400;opacity:.7;font-size:12px}
.stage{flex:1;display:grid;place-items:center;min-height:0;padding:10px 0}
.stage img{max-width:100%;max-height:100%;display:block}
.vcap{text-align:center;font-size:14px;padding:8px 16px 4px;opacity:.85;min-height:20px}
.vtools{display:flex;justify-content:space-around;padding:10px 0 4px}.vtools svg{width:24px}

/* 카메라 */
#camera{background:#000;color:#fff}
.camtop{padding:calc(var(--top) + 6px) 22px 10px;display:flex;justify-content:space-between;align-items:center}
.camtop svg{width:22px}
.finder{position:relative;flex:1;min-height:0;background:#0d0d0d;overflow:hidden}
.finder video{width:100%;height:100%;object-fit:cover;display:block}
.finder video.mirror{transform:scaleX(-1)}
.cammsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.75);white-space:pre-line}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .35s}@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.modes{display:flex;justify-content:center;gap:18px;font-size:13px;font-weight:600;padding:14px 0 10px;color:rgba(255,255,255,.75)}
.modes .on{color:#ffd60a}
.camctl{display:flex;justify-content:space-between;align-items:center;padding:4px 34px 14px}
.thumb{width:48px;height:48px;border-radius:8px;background:#333 center/cover;border:0;padding:0;cursor:pointer}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:transparent;padding:4px;cursor:pointer;box-sizing:border-box}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active i{transform:scale(.88)}
.flip{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);border:0;display:grid;place-items:center;cursor:pointer}.flip svg{width:24px}

/* 캘린더 */
#calendar{background:#fff}
#calendar .nav button{color:#ff3b30}
.calmonth{font-size:30px;font-weight:700;padding:2px 16px 10px;letter-spacing:-.5px}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk{font-size:11px;color:#8e8e93;padding:0 8px 6px;border-bottom:1px solid #e5e5ea}
.days{padding:4px 8px}
.days button{border:0;background:none;height:46px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18px;cursor:pointer;padding:4px 0 0;color:#000}
.days button span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.days .today span{color:#ff3b30;font-weight:600}
.days .sel span{background:#000;color:#fff}
.days .sel.today span{background:#ff3b30;color:#fff}
.days .weekend{color:#8e8e93}
.days i{width:5px;height:5px;border-radius:50%;background:#bbb}
.evs{border-top:1px solid #e5e5ea;padding:12px 16px;flex:1;overflow-y:auto;min-height:0}
.evday{font-size:13px;color:#8e8e93;margin-bottom:6px;font-weight:600}
.ev{display:flex;gap:10px;padding:8px 0}
.ev .bar{width:4px;border-radius:2px;flex-shrink:0}
.ev b{font-size:16px;font-weight:600;display:block}
.ev small{color:#8e8e93;font-size:13px}
.noev{color:#8e8e93;font-size:15px;text-align:center;padding:24px 0}

/* 인터넷 */
#web{background:#f2f2f7}
.webstart{flex:1;overflow-y:auto;padding:calc(var(--top) + 18px) 20px 10px;min-height:0}
.webstart h3{font-size:20px;font-weight:700;margin:0 0 14px}
.favs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;margin-bottom:26px}
.favs div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#333}
.favs span{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff}
.report{background:#fff;border-radius:14px;padding:14px 16px;font-size:13px;color:#555;line-height:1.5}
.report b{display:block;color:#000;font-size:15px;margin-bottom:4px}
.urlbar{margin:8px 12px 6px;background:#fff;border-radius:12px;padding:11px 14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:#8e8e93;box-shadow:0 1px 6px rgba(0,0,0,.08);border:0;cursor:pointer;flex-shrink:0}
.urlbar svg{width:15px}
.webtools{display:flex;justify-content:space-around;padding:6px 0 0;flex-shrink:0}.webtools svg{width:22px}
#searchpanel{background:#f2f2f7;box-shadow:none}
.sbar{display:flex;align-items:center;gap:10px;padding:calc(var(--top) + 8px) 12px 10px}
.sbar .fld{flex:1;background:#fff;border-radius:10px;padding:9px 12px;display:flex;gap:8px;align-items:center;color:#8e8e93;font-size:15px}
.sbar .fld svg{width:15px}.sbar .caret{width:2px;height:18px;background:#0a84ff;animation:blink 1s steps(1) infinite}
.sbar button{background:none;border:0;color:#0a84ff;font-size:16px;cursor:pointer}
.recent{padding:6px 16px}
.recent h4{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;margin:6px 0 10px}
.recent h4 span{font-size:14px;color:#0a84ff;font-weight:400}
.rlist{background:#fff;border-radius:12px}
.ritem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #e5e5ea;font-size:16px}
.ritem:last-child{border-bottom:0}.ritem svg{width:17px;flex-shrink:0}

/* 음악 */
#music{color:#fff;background:#222}
.mbg{position:absolute;inset:-60px;background:center/cover;filter:blur(40px) brightness(.55) saturate(1.4)}
#music>*:not(.mbg){position:relative}
.mwrap{flex:1;display:flex;flex-direction:column;padding:calc(var(--top) + 10px) 28px 0;gap:14px;min-height:0;overflow-y:auto}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:0 auto;border:0;cursor:pointer;padding:0;flex-shrink:0}
.mcover{width:min(100%,250px);align-self:center;flex-shrink:0;aspect-ratio:1;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.4);transition:transform .4s;object-fit:cover;max-width:100%;min-height:0}
.mcover.paused{transform:scale(.84)}
.mtitle{font-size:21px;font-weight:700}.martist{font-size:18px;opacity:.6}
.mbar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}.mbar i{display:block;height:100%;background:rgba(255,255,255,.85)}
.mtimes{display:flex;justify-content:space-between;font-size:12px;opacity:.6;margin-top:6px;font-variant-numeric:tabular-nums}
.mctrl{display:flex;justify-content:space-around;align-items:center}
.mctrl button{background:none;border:0;cursor:pointer;color:#fff;padding:0;display:flex}
.mctrl svg{width:38px}.mctrl .pp svg{width:46px}
.mlist{display:flex;flex-direction:column;gap:2px;font-size:13px}
.mlist button{display:flex;justify-content:space-between;background:none;border:0;color:rgba(255,255,255,.7);cursor:pointer;padding:5px 0;text-align:left}
.mlist button.on{color:#fff;font-weight:600}
.mlist small{opacity:.6}

.banner{position:absolute;left:8px;right:8px;top:calc(var(--top) - 4px);z-index:58;transform:translateY(-160%);transition:transform .5s cubic-bezier(.2,.9,.25,1.1);background:rgba(250,250,252,.85);box-shadow:0 10px 30px rgba(0,0,0,.18);cursor:pointer}
.banner.show{transform:none}

/* 휴대폰으로 열면 화면 전체 */
@media (max-width:520px){
  html,body{background:#000}
  body{padding:0;gap:0}
  .hint,.side,.island,.status{display:none}
  .phone{height:100%;width:100%;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none;background:#000}
  .screen{border-radius:0;--top:max(14px,env(safe-area-inset-top,0px))}
  .appview{padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
  .homebar.abs{bottom:env(safe-area-inset-bottom,0px)}
  #lock>.homebar,#home>.homebar{margin-bottom:env(safe-area-inset-bottom,0px)}
  .pfoot{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  .endbtn{margin-bottom:calc(34px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  P[type](c,w,h,rng(seed*997+13));

let si=0,pos=48,playing=false,mt;
function fmt(s){return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")}
function drawSong(){const s=SONGS[si],cv=paint(s.art[0],s.art[1],500,500);$("mtitle").textContent=s.title;$("martist").textContent=s.artist;$("mcover").src=cv;$("mbg").style.backgroundImage=`url(${cv})`;
  [...$("mlist").children].forEach((b,i)=>b.classList.toggle("on",i===si));drawPos()}
function drawPos(){const s=SONGS[si];$("mbar").style.width=(pos/s.len*100)+"%";$("mcur").textContent=fmt(pos);$("mleft").textContent="-"+fmt(s.len-pos)}
function stopMusic(){playing=false;clearInterval(mt);$("ppicon").innerHTML='<path d="M6 3l15 9-15 9z"/>';$("mcover").classList.add("paused")}
$("mplay").onclick=()=>{if(playing){stopMusic();return}playing=true;$("ppicon").innerHTML='<path d="M6 3h4v18H6zM14 3h4v18h-4z"/>';$("mcover").classList.remove("paused");
  mt=setInterval(()=>{pos++;if(pos>=SONGS[si].len){si=(si+1)%SONGS.length;pos=0;drawSong()}drawPos()},1000)};
$("mnext").onclick=()=>{si=(si+1)%SONGS.length;pos=0;drawSong()};
$("mprev").onclick=()=>{if(pos>3)pos=0;else{si=(si-1+SONGS.length)%SONGS.length;pos=0}drawSong()};
SONGS.forEach((s,i)=>{const b=document.createElement("button");b.innerHTML="<span></span><small></small>";b.querySelector("span").textContent=s.title;b.querySelector("small").textContent=s.artist;
  b.onclick=()=>{si=i;pos=0;drawSong()};$("mlist").appendChild(b)});
drawSong();updateBadges();
</script>
</body>
</html>
